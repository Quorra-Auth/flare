app-id: one.k8ie.Flare
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: flare
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.secrets
modules:
  - name: flare
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm20/bin:/run/build/flare/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        PUB_CACHE: /run/build/flare/.pub-cache
    build-commands:
      - flutter build linux --release --no-pub
      - cp -r $BUNDLE_PATH /app/flare
      - mkdir -p /app/bin
      - ln -s /app/flare/flare /app/bin/flare
      - install -Dm644 flatpak/one.k8ie.Flare.desktop /app/share/applications/one.k8ie.Flare.desktop
      - install -Dm644 flatpak/one.k8ie.Flare.metainfo.xml /app/share/metainfo/one.k8ie.Flare.metainfo.xml
      - install -Dm644 flatpak/one.k8ie.Flare.svg /app/share/icons/hicolor/scalable/apps/one.k8ie.Flare.svg
    sources:
      - type: git
        url: https://github.com/Quorra-Auth/flare.git
        branch: main
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: 3.47.6
        dest: flutter
